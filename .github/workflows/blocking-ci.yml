name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      bazel: ${{ steps.plan.outputs.bazel }}
      cargo_deny: ${{ steps.plan.outputs.cargo_deny }}
      sdk: ${{ steps.plan.outputs.sdk }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 .github/scripts/ci_changes.py
      - name: Test CI routing and result policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_*.py'

  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    needs: changes
    if: needs.changes.outputs.bazel == 'true'
    uses: ./.github/workflows/fork-bazel.yml

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml

  cargo-deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.cargo_deny == 'true'
    uses: ./.github/workflows/cargo-deny.yml

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml

  sdk:
    name: SDK
    needs: [changes, rust-ci]
    # A test/lint failure must not suppress independent SDK results. If the
    # build failed, the missing artifact is reported by the TypeScript job.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.sdk == 'true' }}
    uses: ./.github/workflows/sdk.yml

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - changes
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: >-
            {"bazel": ${{ needs.changes.outputs.bazel == 'false' }},
             "cargo-deny": ${{ needs.changes.outputs.cargo_deny == 'false' }},
             "sdk": ${{ needs.changes.outputs.sdk == 'false' }}}
        run: python3 .github/scripts/check_ci_results.py
