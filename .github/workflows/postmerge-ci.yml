name: fork-full-ci

# Run the heavyweight cross-platform suites explicitly after reviewing the
# normal fork CI result. Keeping this manual avoids duplicate runs and failure
# notifications for every push to main.
on:
  workflow_dispatch:

concurrency:
  group: fork-full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-platforms:
    name: Native Cargo checks
    uses: ./.github/workflows/fork-platforms.yml

  sdk:
    name: SDK checks
    uses: ./.github/workflows/sdk.yml

  results:
    name: Fork full CI results
    needs:
      - fork-platforms
      - sdk
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      # Use the same revision that defined the manually dispatched parent.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
